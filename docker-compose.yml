services:
  api:
    build: .
    ports:
      - "8094:8094"
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PG_HOST: "postgres"
      PG_PORT: 5432
      PG_USER: "obm"
      PG_PASSWORD: "obm123"
      PG_DATABASE: "dbportalobm"
      PG_SSLMODE: "disable"
      MEILI_URL: "http://meilisearch:7700"
      MEILI_API_KEY: "obm-meili-master-key"
      MEILI_INDEX_PREFIX: "obm_"
      JWT_SECRET: "obm-secret-key-change-in-prod"
      JWT_EXPIRATION_HOURS: 24
      SERVER_PORT: 8094
      GIN_MODE: "release"
      SYNC_ON_STARTUP: "true"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      REDIS_CACHE_TTL: 24
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "dbportalobm"
      POSTGRES_USER: "obm"
      POSTGRES_PASSWORD: "obm123"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obm -d dbportalobm"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.8
    ports:
      - "7701:7700"
    environment:
      MEILI_MASTER_KEY: "obm-meili-master-key"
      MEILI_ENV: "production"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 5s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  meilidata:
  redisdata:
